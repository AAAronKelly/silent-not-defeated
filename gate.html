<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>silentnotdefeated.com</title>
<style>
  html { background: #0D0E10; color: #ECE8E1; font: 16px/1.5 system-ui, sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
  form { display: flex; gap: 8px; }
  input { font: inherit; width: 200px; padding: 10px 12px; background: #15161A; color: #ECE8E1; border: 1px solid #3A3D42; border-radius: 0; }
  button { font: inherit; padding: 10px 16px; background: #ECE8E1; color: #0D0E10; border: 0; cursor: pointer; }
  input:focus-visible, button:focus-visible { outline: 2px solid #BFA46F; outline-offset: 2px; }
  p { margin: 12px 0 0; min-height: 1.5em; text-align: center; color: #9B958C; }
  label { position: absolute; left: -9999px; }
</style>
</head>
<body>
<div>
  <form id="gate" autocomplete="off">
    <label for="pw">Password</label>
    <input id="pw" type="password" autofocus>
    <button type="submit">Enter</button>
  </form>
  <p id="msg" aria-live="polite"></p>
</div>

<script id="payload" type="application/json">/*__PAYLOAD__*/</script>
<script>
(async function () {
  var payload = JSON.parse(document.getElementById('payload').textContent);
  var form = document.getElementById('gate');
  var input = document.getElementById('pw');
  var msg = document.getElementById('msg');

  function bytes(b64) { return Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); }); }
  function b64(u8) { return btoa(String.fromCharCode.apply(null, u8)); }

  // Password -> 64 bytes: first half decrypts, second half verifies.
  async function deriveKeys(password) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    var bits = await crypto.subtle.deriveBits(
      { name: 'PBKDF2', hash: 'SHA-256', salt: bytes(payload.salt), iterations: payload.iterations }, base, 512);
    return new Uint8Array(bits);
  }

  async function unlock(keys) {
    var iv = bytes(payload.iv), data = bytes(payload.data);
    var signed = new Uint8Array(iv.length + data.length);
    signed.set(iv); signed.set(data, iv.length);
    var macKey = await crypto.subtle.importKey('raw', keys.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
    if (!(await crypto.subtle.verify('HMAC', macKey, bytes(payload.mac), signed))) return false;
    try { localStorage.setItem('gate-key', b64(keys)); } catch (e) {}
    var aesKey = await crypto.subtle.importKey('raw', keys.slice(0, 32), { name: 'AES-CBC' }, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: iv }, aesKey, data);
    var site = JSON.parse(new TextDecoder().decode(plain));
    function attachImages() {
      document.querySelectorAll('img[data-src]').forEach(function (img) {
        var asset = site.assets[img.getAttribute('data-src')];
        if (asset) img.src = URL.createObjectURL(new Blob([bytes(asset.data)], { type: asset.type }));
      });
    }
    document.open(); document.write(site.html); document.close();
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', attachImages);
    else attachImages();
    return true;
  }

  // Already unlocked on this device? (Wait for the page to finish loading first:
  // document.write is ignored while the initial parse is still running.)
  if (document.readyState !== 'complete') {
    await new Promise(function (resolve) { window.addEventListener('load', resolve); });
  }
  try {
    var saved = localStorage.getItem('gate-key');
    if (saved && await unlock(bytes(saved))) return;
  } catch (e) {}

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    msg.textContent = 'Checking…';
    try {
      if (!(await unlock(await deriveKeys(input.value)))) {
        msg.textContent = 'Wrong password';
        input.select();
      }
    } catch (err) {
      msg.textContent = 'Please open this page over https in a current browser.';
    }
  });
})();
</script>
</body>
</html>
